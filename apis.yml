name: Zocks
description: >-
  Zocks is an AI assistant for financial advisors that captures client conversations and
  automates the administrative side of advice — meeting note-taking with speaker
  attribution, meeting preparation, intake and account form filling, client email
  drafting, document intelligence, and centralized client/household profiles. Captured
  client intelligence syncs across CRM and wealth-management systems including Wealthbox,
  HubSpot, Salesforce, Redtail, Practifi, eMoney, and Orion, with Zoom and Google Meet as
  meeting sources. Rather than a public REST API, Zocks exposes this intelligence to AI
  tools through an official hosted MCP server secured with OAuth 2.0 over Streamable HTTP,
  installable as a connector in Claude, ChatGPT, and Microsoft Copilot with tool-call-level
  audit logging. The company is SOC 2 Type 2 certified and was surfaced as a portfolio
  company of QED Investors. Sector: fintech / wealthtech.
